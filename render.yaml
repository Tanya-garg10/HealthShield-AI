services:
  - type: web
    name: healthshield-ai
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
        required: true
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
        generateValue: true